# One-time cleanup for this repo. Run it from the Actions tab
# (One-time cleanup > Run workflow), then delete this file.
#
# It moves the latest web viewer files into docs/, keeps your Google settings
# and your own add-on edits, removes duplicate and old copies, updates every
# other file to the latest tested version, refreshes the website, and
# (optionally) publishes a new release with the logo in the installer.
name: One-time cleanup

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (clear it to skip)"
        default: "v1.1.0"
        required: false

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

