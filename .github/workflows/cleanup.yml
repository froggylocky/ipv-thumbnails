      - name: Tidy up the files
        run: |
          set -euo pipefail
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"; REPO_NAME="${GITHUB_REPOSITORY##*/}"
          PAGES="https://${REPO_OWNER}.github.io/${REPO_NAME}/"
          echo "::group::1. Unpack the latest files"
          mkdir -p /tmp/latest && tar -xzf /tmp/latest.tgz -C /tmp/latest
          echo "::endgroup::"

          echo "::group::2. Keep your Google settings (config.js)"
          node - <<'JS'
          const fs = require('fs');
          const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '').replace(/\/\/.*$/gm, '');
          const sources = ['config.js', 'docs/config.js', 'ipv-thumbnails/docs/config.js'].map(read);   // newest upload first
          const get = (text, key) => { const m = new RegExp(key + "\\s*:\\s*(['\"]?)([^'\",\\n}]*)\\1").exec(text); return m ? m[2].trim() : ''; };
          const pick = (key) => { for (const s of sources) { const v = get(s, key); if (v && v !== 'false') return v; } return ''; };
          let out = fs.readFileSync('/tmp/latest/docs/config.js', 'utf8');
          const kept = [];
          for (const key of ['clientId', 'apiKey', 'appId']) {
            const v = pick(key);
            if (v) { out = out.replace(new RegExp('(' + key + ":\\s*)''"), `$1'${v.replace(/'/g, '')}'`); kept.push(key); }
          }
          if (pick('openWith') === 'true') { out = out.replace('openWith: false', 'openWith: true'); kept.push('openWith'); }
          fs.writeFileSync('/tmp/latest/docs/config.js', out);
          console.log(kept.length ? `Kept your values for: ${kept.join(', ')}` : 'No Google values filled in yet; using the blank template.');
          JS
          echo "::endgroup::"

          echo "::group::3. Keep your own add-on files (Addon.gs, appsscript.json)"
          for f in drive-addon/Addon.gs drive-addon/appsscript.json; do
            if [ -f "$f" ]; then cp "$f" "/tmp/latest/$f"; echo "Kept your $f"; fi
          done
          echo "::endgroup::"

          echo "::group::4. Replace the files with the latest versions"
          tar -C /tmp/latest -cf - . | tar -xf -
          echo "::endgroup::"

          echo "::group::5. Fix logo links that point at GitHub's file page instead of the image"
          for f in drive-addon/Addon.gs drive-addon/appsscript.json; do
            [ -f "$f" ] || continue
            before=$(cat "$f")
            sed -i -E "s#https://github\.com/[^/]+/[^/]+/blob/[^/]+/docs/#${PAGES}#g; s#https://raw\.githubusercontent\.com/[^/]+/[^/]+/[^/]+/docs/#${PAGES}#g" "$f"
            [ "$before" != "$(cat "$f")" ] && echo "Fixed the logo link in $f -> ${PAGES}icons/..." || echo "$f: logo link OK"
          done
          echo "::endgroup::"

          echo "::group::6. Remove duplicates and old copies"
          REMOVE="app.js config.js index.html smoke_test.cpp"
          # This workflow can't edit build.yml, so keep the old script folder if build.yml still tests it.
          if grep -qs "drive-script" .github/workflows/build.yml; then
            echo "::warning::Your build.yml still tests drive-script/, so it was kept. Replace .github/workflows/build.yml with the latest version, then delete drive-script/."
          else
            REMOVE="$REMOVE drive-script tests/test_apps_script.cjs"
          fi
          git rm -r -q --ignore-unmatch $REMOVE
          rm -rf $REMOVE
          echo "Removed: $REMOVE"
          if [ -d ipv-thumbnails ]; then
            # Everything except its .github folder now; that last bit is tried separately,
            # because GitHub may not let a workflow delete workflow files.
            git rm -r -q --ignore-unmatch -- ipv-thumbnails ':(exclude)ipv-thumbnails/.github'
            # (git rm deletes the folder itself if nothing is left in it, so check first)
            if [ -d ipv-thumbnails ]; then find ipv-thumbnails -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +; fi
            echo "Removed the nested ipv-thumbnails/ copy"
          fi
          echo "::endgroup::"
          git add -A -- . ':(exclude).github' ':(exclude)ipv-thumbnails/.github'
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing needed changing."
          else
            git commit -q -m "Tidy up: viewer files into docs/, remove duplicates, latest versions"
            git push
            echo "Pushed the tidy-up commit."
          fi
          if [ -n "$(git ls-files ipv-thumbnails)" ]; then
            git rm -r -q ipv-thumbnails
            git commit -q -m "Remove the rest of the nested ipv-thumbnails/ copy"
            if git push; then
              echo "Removed the rest of the nested ipv-thumbnails/ folder."
            else
              git reset -q --hard HEAD~1
              echo "::warning::GitHub didn't allow this workflow to delete ipv-thumbnails/.github (workflow files). Delete it yourself: open the ipv-thumbnails folder, click the ... menu, then Delete directory."
            fi
          fi

      - name: Refresh the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null; then
            echo "Asked GitHub Pages to rebuild the site. It updates in a minute or two."
          else
            echo "::warning::Couldn't ask GitHub Pages to rebuild. It may still update by itself; if not, make any small edit to a file in docs/."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.release }}
        run: |
          if [ -z "$REL" ]; then echo "No release requested."; exit 0; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$REL" > /dev/null; then
            echo "::warning::$REL already exists, so no new release was made. Run again with a different version, such as v1.1.1."
            exit 0
          fi
          git tag "$REL"
          git push origin "$REL"
          gh workflow run build.yml --ref "$REL"
          echo "Started the Build workflow for $REL. The installer appears on the Releases page when it finishes (a few minutes)."
